apiVersion: v1
kind: ConfigMap
metadata:
  name: mailfind-config
  namespace: mailfind
data:
  # Application Configuration
  ENVIRONMENT: "production"
  LOG_LEVEL: "info"
  
  # Backend Configuration
  BACKEND_PORT: "8000"
  BACKEND_HOST: "0.0.0.0"
  
  # Frontend Configuration
  FRONTEND_PORT: "80"
  
  # Feature Flags
  SMART_SEARCH_ENABLED: "true"
  ADAPTIVE_SEARCH_ENABLED: "true"

