# PersistentVolumeClaim for Backend Logs
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mailfind-backend-logs
  namespace: mailfind
spec:
  accessModes:
  - ReadWriteMany
  resources:
    requests:
      storage: 5Gi
  storageClassName: standard

