apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mailfind-ingress
  namespace: mailfind
  annotations:
    # NGINX Ingress Controller annotations
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    
    # CORS Configuration
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://mail.google.com"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-credentials: "true"
    
    # Rate Limiting (optional)
    nginx.ingress.kubernetes.io/limit-rps: "100"
    
    # Timeouts for long-running requests
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    
    # Certificate manager (if using cert-manager for TLS)
    # cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - mailfind.example.com
    - api.mailfind.example.com
    secretName: mailfind-tls-cert
  rules:
  # Frontend
  - host: mailfind.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: mailfind-frontend
            port:
              number: 80
  
  # Backend API
  - host: api.mailfind.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: mailfind-backend
            port:
              number: 8000

