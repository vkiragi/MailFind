apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailfind-backend
  namespace: mailfind
  labels:
    app: mailfind
    component: backend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: mailfind
      component: backend
  template:
    metadata:
      labels:
        app: mailfind
        component: backend
    spec:
      containers:
      - name: backend
        image: mailfind-backend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        env:
        # Configuration from ConfigMap
        - name: ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: mailfind-config
              key: ENVIRONMENT
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: mailfind-config
              key: LOG_LEVEL
        
        # Secrets
        - name: SUPABASE_PUBLIC_URL
          valueFrom:
            secretKeyRef:
              name: mailfind-secrets
              key: SUPABASE_PUBLIC_URL
        - name: SERVICE_ROLE
          valueFrom:
            secretKeyRef:
              name: mailfind-secrets
              key: SERVICE_ROLE
        - name: SUPABASE_ANON_KEY
          valueFrom:
            secretKeyRef:
              name: mailfind-secrets
              key: SUPABASE_ANON_KEY
              optional: true
        - name: GOOGLE_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: mailfind-secrets
              key: GOOGLE_CLIENT_ID
        - name: GOOGLE_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: mailfind-secrets
              key: GOOGLE_CLIENT_SECRET
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: mailfind-secrets
              key: OPENAI_API_KEY
        - name: ENCRYPTION_KEY
          valueFrom:
            secretKeyRef:
              name: mailfind-secrets
              key: ENCRYPTION_KEY
        
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        
        livenessProbe:
          httpGet:
            path: /
            port: 8000
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        
        readinessProbe:
          httpGet:
            path: /
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        
        volumeMounts:
        - name: logs
          mountPath: /app/logs
      
      volumes:
      - name: logs
        emptyDir: {}
      
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      
      restartPolicy: Always

